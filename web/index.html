<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Atenciones en Salud – Municipalidad de Córdoba</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; height: 100vh; overflow: hidden; background: #f0f2f5;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: 340px; min-width: 300px; max-width: 360px;
      background: #fff; display: flex; flex-direction: column;
      overflow-y: auto; box-shadow: 2px 0 8px rgba(0,0,0,0.12); z-index: 1000;
    }

    /* ── HEADER ── */
    .sidebar-header {
      background: #fff; padding: 14px 12px 10px; border-bottom: 1px solid #e5e7eb;
    }
    .logo-row {
      display: flex; align-items: center; justify-content: space-around;
      gap: 6px; margin-bottom: 10px; padding: 0 4px;
    }
    .logo-ss, .logo-muni, .logo-coord { display:flex; align-items:center; }
    .logo-row img { height: 50px; width: auto; object-fit: contain; max-width: 100px; }
    .sidebar-title {
      font-size:24px; font-weight:700; color:#1a2e4a;
      line-height:1.3; text-align:center; padding:14px 0 4px;
      border-top: 1px solid #e5e7eb; margin-top: 10px;
    }

    /* ── FILTROS ── */
    .filters-section { padding: 14px 12px 10px; flex: 1; border-top: 1px solid #e5e7eb; }
    .filter-group { margin-bottom: 16px; }
    .filter-label-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
    }
    .filter-label-row .ftxt {
      font-size: 14px; font-weight: 700; color: #374151;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Dropdown */
    .ms-wrap { position: relative; }
    .ms-btn {
      width:100%; padding:7px 12px; border:1px solid #d1d5db; border-radius:6px;
      background:#fff; cursor:pointer; font-size:12.5px; color:#374151;
      text-align:left; display:flex; justify-content:space-between; align-items:center;
    }
    .ms-btn:hover { background: #f9fafb; }
    .ms-btn::after { content:'▼'; font-size:9px; color:#9ca3af; }
    .ms-drop {
      display:none; position:absolute; top:calc(100% + 3px); left:0; right:0;
      background:#fff; border:1px solid #d1d5db; border-radius:6px;
      box-shadow:0 4px 16px rgba(0,0,0,0.15); z-index:2000;
      max-height:230px; overflow-y:auto;
    }
    .ms-drop.open { display: block; }
    .ms-actions {
      display:flex; gap:4px; padding:5px 8px; border-bottom:1px solid #e5e7eb;
      position:sticky; top:0; background:#fff;
    }
    .ms-actions button {
      flex:1; font-size:10.5px; padding:3px 0; border:1px solid #d1d5db;
      border-radius:4px; background:#f9fafb; cursor:pointer; color:#374151;
    }
    .ms-actions button:hover { background: #e5e7eb; }
    .ms-actions .apply-btn { background:#1a2e4a; color:#fff; border-color:#1a2e4a; }
    .ms-actions .apply-btn:hover { background: #243d5e; }
    .ms-list { padding: 3px 0; }
    .ms-item {
      display:flex; align-items:center; gap:8px; padding:5px 10px;
      cursor:pointer; font-size:12px; color:#374151; line-height:1.3;
    }
    .ms-item:hover { background: #f3f4f6; }
    .ms-item input[type=checkbox] { cursor:pointer; accent-color:#1a2e4a; flex-shrink:0; }

    /* Clear */
    .clear-btn {
      display:block; width:100%; margin:6px 0 12px; padding:9px 0;
      background:#6b7280; color:#fff; border:none; border-radius:6px;
      cursor:pointer; font-size:13px; font-weight:600;
    }
    .clear-btn:hover { background: #4b5563; }

    .status-text { font-size:11px; color:#9ca3af; padding:0 12px 10px; text-align:center; }
    .status-text.success { color: #10b981; }

    /* ── MAPA ── */
    #map { flex:1; height:100%; }

    /* ── LEYENDA ── */
    .map-legend {
      position:absolute; bottom:28px; right:10px;
      background:rgba(255,255,255,0.96); border-radius:8px;
      box-shadow:0 2px 8px rgba(0,0,0,0.2); padding:10px 12px;
      z-index:800; min-width:170px; font-size:12px;
    }
    .legend-title { font-weight:700; margin-bottom:7px; color:#1a2e4a; font-size:12px; }
    .legend-item { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .legend-item span { font-size:12px; color:#374151; }

    /* Force tooltip text black */
    .leaflet-tooltip { color: #111 !important; }

    /* ── Puntos cardinales pills ── */
    .cardinal-pills {
      display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 7px;
    }
    .cardinal-pill {
      flex: 1; min-width: 60px; padding: 5px 4px;
      border: 2px solid var(--pill-color);
      border-radius: 20px; background: #fff;
      color: var(--pill-color); font-size: 11.5px; font-weight: 700;
      cursor: pointer; text-align: center; transition: all 0.15s;
      white-space: nowrap;
    }
    .cardinal-pill:hover { background: var(--pill-color); color: #fff; }
    .cardinal-pill.active { background: var(--pill-color); color: #fff; }

    /* Scrollbar */
    #sidebar::-webkit-scrollbar { width:4px; }
    #sidebar::-webkit-scrollbar-track { background:#f3f4f6; }
    #sidebar::-webkit-scrollbar-thumb { background:#d1d5db; border-radius:10px; }

    @media (max-width:600px) {
      body { flex-direction:column; }
      #sidebar { width:100%; max-width:100%; height:auto; max-height:48vh; }
      #map { height:52vh; }
    }
  </style>
</head>
<body>

<!-- ── SIDEBAR ── -->
<div id="sidebar">

  <!-- HEADER -->
  <div class="sidebar-header">
    <div class="logo-row">

      <!-- Logo 1: Municipalidad de Córdoba -->
      <div class="logo-muni">
        <img src="./assets/LogoMuni.png" alt="Municipalidad de Córdoba" style="height:64px !important; max-width:110px !important;"/>
      </div>

      <!-- Logo 2: Secretaría de Salud -->
      <div class="logo-ss">
        <img src="./assets/SecreC.png" alt="Secretaría de Salud"/>
      </div>

      <!-- Logo 3: Coordinación Tecnológica -->
      <div class="logo-coord">
        <img src="./assets/HorizontalCT.png" alt="Coordinación Tecnológica" style="height:72px !important; max-width:130px !important;"/>
      </div>
    </div>
    <div class="sidebar-title">Mapa de Efectores Municipales</div>
  </div>

  <!-- FILTROS -->
  <div class="filters-section">

    <!-- Puntos Cardinales -->
    <div class="filter-group">
      <div class="filter-label-row">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="#1a2e4a" stroke-width="1.8" fill="#eef2ff"/>
          <line x1="12" y1="2" x2="12" y2="22" stroke="#1a2e4a" stroke-width="1.5"/>
          <line x1="2" y1="12" x2="22" y2="12" stroke="#1a2e4a" stroke-width="1.5"/>
          <polygon points="12,3 10.5,7 13.5,7" fill="#1a2e4a"/>
        </svg>
        <span class="ftxt">Puntos Cardinales</span>
      </div>
      <div class="cardinal-pills" id="cardinalPills">
        <button class="cardinal-pill" data-dir="Norte" style="--pill-color:#2563eb">↑ Norte</button>
        <button class="cardinal-pill" data-dir="Sur"   style="--pill-color:#dc2626">↓ Sur</button>
        <button class="cardinal-pill" data-dir="Este"  style="--pill-color:#16a34a">→ Este</button>
        <button class="cardinal-pill" data-dir="Oeste" style="--pill-color:#d97706">← Oeste</button>
      </div>
    </div>

    <!-- Zonas Sanitarias -->
    <div class="filter-group">
      <div class="filter-label-row">
        <svg width="16" height="21" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2 C8 2 5 5.5 5 9 C5 14 12 22 12 22 C12 22 19 14 19 9 C19 5.5 16 2 12 2Z" stroke="#e67e22" stroke-width="1.8" fill="#fff7ed"/>
          <circle cx="12" cy="9" r="3" stroke="#e67e22" stroke-width="1.8"/>
        </svg>
        <span class="ftxt">Zonas Sanitarias</span>
      </div>
      <div class="ms-wrap" id="zonasWrap">
        <button class="ms-btn" id="zonasBtn">Cargando...</button>
        <div class="ms-drop" id="zonasDrop">
          <div class="ms-actions">
            <button id="zonasAll">Todas</button>
            <button id="zonasNone">Ninguna</button>
            <button class="apply-btn" id="zonasApply">Aplicar</button>
          </div>
          <div class="ms-list" id="zonasList"></div>
        </div>
      </div>
    </div>

    <!-- Centros de Salud -->
    <div class="filter-group">
      <div class="filter-label-row">
        <img src="./assets/CS.png" alt="Centro de Salud" style="width:22px;height:22px;object-fit:contain;"/>
        <span class="ftxt">Centros de Salud</span>
      </div>
      <div class="ms-wrap" id="csWrap">
        <button class="ms-btn" id="csBtn">Cargando...</button>
        <div class="ms-drop" id="csDrop">
          <div class="ms-actions">
            <button id="csAll">Todos</button>
            <button id="csNone">Ninguno</button>
            <button class="apply-btn" id="csApply">Aplicar</button>
          </div>
          <div class="ms-list" id="csList"></div>
        </div>
      </div>
    </div>

    <!-- DEM -->
    <div class="filter-group">
      <div class="filter-label-row">
        <img src="./assets/DEM.png" alt="DEM" style="width:22px;height:22px;object-fit:contain;"/>
        <span class="ftxt">DEM</span>
      </div>
      <div class="ms-wrap" id="demWrap">
        <button class="ms-btn" id="demBtn">Ninguno</button>
        <div class="ms-drop" id="demDrop">
          <div class="ms-actions">
            <button id="demAll">Todos</button>
            <button id="demNone">Ninguno</button>
            <button class="apply-btn" id="demApply">Aplicar</button>
          </div>
          <div class="ms-list" id="demList"></div>
        </div>
      </div>
    </div>

    <!-- Hospitales -->
    <div class="filter-group">
      <div class="filter-label-row">
        <img src="./assets/hospital.png" alt="Hospital" style="width:22px;height:22px;object-fit:contain;"/>
        <span class="ftxt">Hospitales Municipales</span>
      </div>
      <div class="ms-wrap" id="hospWrap">
        <button class="ms-btn" id="hospBtn">Ninguno</button>
        <div class="ms-drop" id="hospDrop">
          <div class="ms-actions">
            <button id="hospAll">Todos</button>
            <button id="hospNone">Ninguno</button>
            <button class="apply-btn" id="hospApply">Aplicar</button>
          </div>
          <div class="ms-list" id="hospList"></div>
        </div>
      </div>
    </div>

    <!-- Salud Mental -->
    <div class="filter-group">
      <div class="filter-label-row">
        <img src="./assets/SaludMental.png" alt="Salud Mental" style="width:22px;height:22px;object-fit:contain;"/>
        <span class="ftxt">Salud Mental</span>
      </div>
      <div class="ms-wrap" id="smWrap">
        <button class="ms-btn" id="smBtn">Ninguno</button>
        <div class="ms-drop" id="smDrop">
          <div class="ms-actions">
            <button id="smAll">Todos</button>
            <button id="smNone">Ninguno</button>
            <button class="apply-btn" id="smApply">Aplicar</button>
          </div>
          <div class="ms-list" id="smList"></div>
        </div>
      </div>
    </div>

    <button class="clear-btn" id="clearFiltersBtn">🧹 Limpiar Todos los Filtros</button>

  </div>

  <div id="status" class="status-text">Cargando datos...</div>

</div>

<!-- MAPA -->
<div id="map"></div>

<!-- LEYENDA -->
<div id="filterLegend" class="map-legend" style="display:none;"></div>

<script src="./app.js"></script>
<script>
  document.getElementById("cardinalPills").addEventListener("click", e => {
    const pill = e.target.closest(".cardinal-pill");
    if (!pill) return;
    pill.classList.toggle("active");
    applyFilter();
  });
</script>
</body>
</html>
